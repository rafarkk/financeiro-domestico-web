<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320">
  <!-- textura de papel, no lugar do fundotext.png do app original -->
  <filter id="papel" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.45  0 0 0 0 0.43  0 0 0 0.16 0"/>
  </filter>
  <rect width="320" height="320" fill="#F6F6F4"/>
  <rect width="320" height="320" filter="url(#papel)"/>
</svg>

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # fase de testes: mostra "Dados de exemplo" e "Apagar tudo" no menu da home
          VITE_FERRAMENTAS_TESTE: '1'
      # o Pages não conhece as rotas do app; o 404 devolve o próprio app para elas
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # com o Pages em "Deploy from a branch" o GitHub também publica o README a cada push;
      # a espera garante que este deploy saia por último. Com Source = GitHub Actions pode sair.
      - run: sleep 90
      - id: deployment
        uses: actions/deploy-pages@v4
